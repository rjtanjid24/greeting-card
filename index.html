<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভেচ্ছা কার্ড জেনারেটর</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');

        /* ১. পেজ লেআউট ফিক্স */
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-height: 98vh; 
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h2 {
            text-align: center;
            color: #124e66;
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin: 0 0 20px 0;
            font-size: 13px;
        }

        /* ২. গ্রিড লেআউট */
        .editor-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            height: 100%;
            overflow: hidden;
        }

        @media (max-width: 850px) {
            body { height: auto; display: block; padding: 20px 0; }
            .container { max-height: none; overflow: visible; }
            .editor-grid { grid-template-columns: 1fr; }
            .preview-box canvas { max-height: 400px !important; }
        }

        /* বাম পাশের কন্ট্রোলস */
        .controls {
            overflow-y: auto;
            padding-right: 10px;
            max-height: 75vh;
        }

        .salami-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            text-align: center;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .salami-btn:hover {
            background-color: #218838;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            color: #444;
            font-size: 14px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type=range] {
            width: 100%;
            margin-bottom: 5px;
            cursor: pointer;
        }
        
        .hint-text {
            font-size: 11px;
            color: #888;
            margin-bottom: 15px;
            display: block;
        }

        /* ৩. প্রিভিউ বক্স */
        .preview-box {
            background: #e9ecef;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 2px dashed #cbd5e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            max-height: 75vh;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 60vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: grab; /* ড্র্যাগ করার নির্দেশক */
        }
        
        canvas:active {
            cursor: grabbing;
        }

        .download-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 12px;
            background-color: #124e66;
            color: white;
            text-align: center;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none; 
            transition: 0.3s;
        }
        .download-btn:hover { background-color: #0d3b4d; }

        .frames-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .frame-thumb {
            width: 60px;
            height: 60px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            object-fit: cover;
            transition: 0.2s;
        }
        
        .frame-thumb.active {
            border-color: #124e66;
            box-shadow: 0 0 5px rgba(18, 78, 102, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h2>শুভেচ্ছা কার্ড তৈরি করুন</h2>
            <p class="subtitle">আপনার ছবি, নাম ও পদবী দিয়ে কার্ড তৈরি করুন</p>
        </div>

        <div class="editor-grid">
            <div class="controls">
                <a href="https://rjtanjid24.github.io/salami/" target="_blank" class="salami-btn">🎁 সেলামী অ্যাপ (Salami App)</a>

                <label>ফ্রেম নির্বাচন করুন</label>
                <div class="frames-container">
                    <img src="gc_01.png" class="frame-thumb active" onclick="selectFrame(this)">
                    <img src="gc_02.png" class="frame-thumb" onclick="selectFrame(this)">
                    <img src="gc_03.png" class="frame-thumb" onclick="selectFrame(this)">
                </div>

                <label>ছবি নির্বাচন করুন</label>
                <input type="file" id="uploadInput" accept="image/*">

                <label>ছবির সাইজ ঠিক করুন</label>
                <input type="range" id="zoomSlider" min="0.5" max="3" step="0.05" value="1" disabled>
                <small class="hint-text">টিপস: ছবির ওপর মাউস বা হাত দিয়ে টেনে পজিশন ঠিক করতে পারবেন।</small>

                <label>আপনার নাম লিখুন</label>
                <input type="text" id="nameInput" placeholder="যেমন: তানজিদ শুভ্র">

                <label>আপনার পদবী লিখুন</label>
                <input type="text" id="designationInput" placeholder="যেমন: রিপোর্টার">

            </div>

            <div class="preview-box">
                <canvas id="canvas" width="1080" height="1080"></canvas>
                <a href="#" id="downloadLink" class="download-btn">📥 ডাউনলোড করুন</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('uploadInput');
        const nameInput = document.getElementById('nameInput');
        const designationInput = document.getElementById('designationInput');
        const zoomSlider = document.getElementById('zoomSlider');
        const downloadLink = document.getElementById('downloadLink');

        let userImage = new Image();
        let frameImage = new Image();
        let zoomLevel = 1;
        
        // ড্র্যাগিং এর জন্য ভ্যারিয়েবলস (ছবি প্যান করার জন্য)
        let imgOffsetX = 0;
        let imgOffsetY = 0;
        let isDragging = false;
        let startDragX = 0;
        let startDragY = 0;

        // আপনার পুরোনো পজিশন সেটিংস
        const circleCenterX = 760; 
        const circleCenterY = 700; 
        const textLeftMargin = 50;  
        const nameY = 920;          
        const desigY = 970;         

        window.onload = function() {
            const defaultFrame = document.querySelector('.frame-thumb.active');
            if(defaultFrame) {
                frameImage.onload = function() { draw(); };
                frameImage.src = defaultFrame.src;
            }
        };

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImage.onload = () => {
                        zoomSlider.disabled = false;
                        zoomSlider.value = 1;
                        zoomLevel = 1;
                        imgOffsetX = 0; // নতুন ছবিতে পজিশন রিসেট
                        imgOffsetY = 0;
                        draw();
                    };
                    userImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        nameInput.addEventListener('input', draw);
        designationInput.addEventListener('input', draw);
        zoomSlider.addEventListener('input', (e) => {
            zoomLevel = parseFloat(e.target.value);
            draw();
        });

        function selectFrame(imgElement) {
            document.querySelectorAll('.frame-thumb').forEach(img => img.classList.remove('active'));
            imgElement.classList.add('active');
            
            frameImage.onload = function() { draw(); };
            frameImage.src = imgElement.src;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ছবি রেন্ডার
            if (userImage.src && userImage.complete && userImage.naturalWidth !== 0) {
                // ক্যানভাসের সাপেক্ষে সঠিক রেশিও (Object-fit: cover এর মতো)
                const baseScale = Math.max(canvas.width / userImage.width, canvas.height / userImage.height);
                const finalScale = baseScale * zoomLevel;
                const imgW = userImage.width * finalScale;
                const imgH = userImage.height * finalScale;
                
                // ছবিকে মাঝখানে সেট করা এবং মাউস ড্র্যাগ (Offset) হিসাব করা
                const x = circleCenterX - (imgW / 2) + imgOffsetX;
                const y = circleCenterY - (imgH / 2) + imgOffsetY;
                
                ctx.drawImage(userImage, x, y, imgW, imgH);
            }

            // ফ্রেম রেন্ডার
            if (frameImage.src && frameImage.complete && frameImage.naturalWidth !== 0) {
                ctx.drawImage(frameImage, 0, 0, canvas.width, canvas.height);
            }

            drawText();
        }

        function drawText() {
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ffffff'; 

            const name = nameInput.value;
            const designation = designationInput.value;

            if (name) {
                ctx.font = 'bold 50px "Hind Siliguri", sans-serif';
                ctx.fillText(name, textLeftMargin, nameY);
            }

            if (designation) {
                ctx.font = '400 35px "Hind Siliguri", sans-serif';
                ctx.fillText(designation, textLeftMargin, desigY);
            }
        }

        // --- Drag & Pan Feature (মাউস দিয়ে ছবি সরানো) ---
        function getCanvasMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX || e.touches?.[0].clientX;
            let clientY = e.clientY || e.touches?.[0].clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDragging(e) {
            if (!userImage.src) return;
            isDragging = true;
            const pos = getCanvasMousePos(e);
            startDragX = pos.x - imgOffsetX;
            startDragY = pos.y - imgOffsetY;
        }

        function moveDragging(e) {
            if (!isDragging) return;
            e.preventDefault(); // স্ক্রলিং বন্ধ করতে
            const pos = getCanvasMousePos(e);
            imgOffsetX = pos.x - startDragX;
            imgOffsetY = pos.y - startDragY;
            draw();
        }

        function stopDragging() {
            isDragging = false;
        }

        // মাউস ইভেন্ট
        canvas.addEventListener('mousedown', startDragging);
        window.addEventListener('mousemove', moveDragging);
        window.addEventListener('mouseup', stopDragging);

        // টাচ ইভেন্ট (মোবাইলের জন্য)
        canvas.addEventListener('touchstart', startDragging, {passive: false});
        window.addEventListener('touchmove', moveDragging, {passive: false});
        window.addEventListener('touchend', stopDragging);

        // --- Download Logic ---
        downloadLink.addEventListener('click', function(e) {
            const inputName = nameInput.value.trim();
            const fileName = inputName ? `card-${inputName}.png` : 'greeting-card.png';
            
            try {
                const dataUrl = canvas.toDataURL('image/png', 1.0);
                this.href = dataUrl;
                this.download = fileName;
            } catch (error) {
                console.error("Download Error", error);
                alert("ডাউনলোড ফেইল্ড। লোকাল ইমেজ ব্যবহার করুন।");
            }
        });
    </script>
</body>
</html>
